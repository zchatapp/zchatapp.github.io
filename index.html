<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05060a">
<meta name="color-scheme" content="dark light">
<title>ZChat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZChat">
<style>
:root{
  color-scheme:dark;
  --acc-rgb:29,147,233;--accent:rgb(var(--acc-rgb));
  --bg:#05060a;--fg:#fff;--fg2:#a3a8b3;--muted:#8a8f9a;
  --gc:255,255,255;--ga1:.17;--ga2:.05;--gb:.3;--gk:1;--blur:18px;
  --shadow:rgba(0,0,0,.4);--edge:rgba(255,255,255,0);
  --field:rgba(255,255,255,.08);--authbg:#181818;--blobop:.42;--sheet:rgba(0,0,0,.55);
}
html[data-theme=light]{
  color-scheme:light;
  --bg:#e9eff9;--fg:#0e1320;--fg2:#5b6475;--muted:#6b7280;
  --ga1:.78;--ga2:.38;--gb:.95;--shadow:rgba(40,60,110,.2);--edge:rgba(20,30,60,.09);
  --field:rgba(255,255,255,.75);--authbg:#f1f4fa;--blobop:.6;--sheet:rgba(20,30,60,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{position:relative;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}

.blobs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blobop)}
.blobs i:nth-child(1){width:280px;height:280px;background:var(--accent);top:6%;left:-90px}
.blobs i:nth-child(2){width:250px;height:250px;background:#9b4dff;top:44%;right:-100px}
.blobs i:nth-child(3){width:230px;height:230px;background:#00c2c7;bottom:-70px;left:18%}

.screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:1}
.screen.active{display:flex;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.glass{
  background:linear-gradient(135deg,rgba(var(--gc),calc(var(--ga1)*var(--gk))),rgba(var(--gc),calc(var(--ga2)*var(--gk))));
  border:1px solid rgba(var(--gc),calc(var(--gb)*var(--gk)));
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(var(--gc),.45),inset 0 -1px 0 rgba(var(--gc),.08),0 0 0 .5px var(--edge),0 8px 24px var(--shadow)}

/* ---------- auth ---------- */
#auth{background:var(--authbg);z-index:3;padding:0 45px}
.logo{font-weight:400;font-size:clamp(48px,17vw,72px);text-align:center;margin:18vh 0 0;letter-spacing:-1px}
.authform{margin-top:20vh;display:flex;flex-direction:column;gap:12px}
.authform p{margin:0 0 6px;text-align:center;color:var(--fg2);font-size:14px}
.authform .err{color:#ff6b6b;min-height:18px;margin:2px 0 0}
.authform input{height:46px;border-radius:999px;border:1px solid rgba(150,150,150,.6);background:var(--field);color:var(--fg);text-align:center;font-size:18px;outline:none;padding:0 18px}
.authform input::placeholder{color:var(--muted)}
.authform input:focus{border-color:var(--accent)}
.authform input[readonly]{opacity:.7}
.authfoot{margin-top:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px}
.primary{height:50px;width:100%;border-radius:999px;border:1px solid rgba(255,255,255,.8);background:var(--accent);color:#fff;font-size:19px}
.primary.small{height:42px;width:auto;padding:0 22px;font-size:16px}
.ghost{background:none;border:0;color:var(--fg2);font-size:16px;padding:8px 12px}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
.danger{height:46px;width:100%;border-radius:999px;border:1px solid #ff453a;background:none;color:#ff6b61;font-size:16px}

/* ---------- home ---------- */
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(30px + env(safe-area-inset-top)) 24px 4px 28px}
.top h1{margin:0;font-weight:400;font-size:40px;letter-spacing:-.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:8px;vertical-align:middle;background:#888}
.dot.online{background:#34c759}.dot.connecting{background:#ffcc00}.dot.offline,.dot.taken{background:#ff453a}
.burger{width:46px;height:46px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:0}
.burger i{display:block;width:20px;height:3px;border-radius:2px;background:var(--fg)}
.netbar{margin:8px 20px 0;border-radius:18px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.netbar button{background:var(--accent);border:0;color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;flex:none}
.tabs{flex:1;overflow-y:auto;padding-bottom:120px}
.tab{display:none}.tab.active{display:block}
.stories{display:flex;gap:12px;overflow-x:auto;padding:14px 22px 20px;align-items:center;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.plus{flex:none;width:72px;height:72px;border-radius:50%;position:relative;margin-right:4px;background:linear-gradient(135deg,rgba(var(--gc),calc(var(--ga1)*var(--gk))),rgba(var(--gc),calc(var(--ga2)*var(--gk))));border:1px solid rgba(var(--gc),.4);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.plus::before,.plus::after{content:"";position:absolute;left:50%;top:50%;background:var(--fg2);border-radius:2px;transform:translate(-50%,-50%)}
.plus::before{width:30px;height:4px}.plus::after{width:4px;height:30px}
.story{flex:none;width:100px;height:140px;border-radius:22px;position:relative;overflow:hidden;border:1px solid rgba(var(--gc),.35);background:#111;padding:0;box-shadow:0 6px 18px var(--shadow)}
.story.new{border:2px solid var(--accent);box-shadow:0 0 16px rgba(var(--acc-rgb),.55)}
.story.seen{opacity:.72}
.sbg{position:absolute;inset:-10px;background-size:cover;background-position:center;filter:blur(7px) saturate(1.3)}
.story::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 40%,rgba(0,0,0,.25))}
.sname{position:absolute;z-index:1;left:8px;top:8px;right:6px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:left}
.sname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sname .av{border:1px solid #fff}
.row{display:flex;align-items:center;gap:16px;width:calc(100% - 32px);margin:8px 16px;padding:10px 18px 10px 12px;border-radius:30px;text-align:left}
.row.plain{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.meta{flex:1;min-width:0}
.nm{font-weight:700;font-size:18px;display:flex;align-items:center;gap:5px}
.nmw{display:inline-flex;align-items:center;gap:4px;min-width:0}
.badge-gold{display:inline-flex;width:1.05em;height:1.05em;flex:none}
.badge-gold svg{width:100%;height:100%}
.pv{font-size:15px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv.read{color:var(--fg2)}
.cnt{min-width:28px;height:28px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;padding:0 8px}
.av{border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
.av.lg{width:60px;height:60px;font-size:25px}
.av.md{width:46px;height:46px;font-size:19px}
.av.xs{width:28px;height:28px;font-size:12px}
.av.xl{width:112px;height:112px;font-size:48px}
.ring-on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.ring-off{box-shadow:0 0 0 3px var(--bg),0 0 0 5px rgba(128,128,128,.4)}
.empty{color:var(--muted);text-align:center;padding:40px 36px;line-height:1.5;font-size:15px}
.sub{padding:22px 28px 6px;font-size:22px;margin:0;font-weight:400}
.profile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 36px;text-align:center}
.profile .big{font-size:26px;font-weight:700;display:flex;gap:6px;align-items:center;justify-content:center}
.profile .stat{color:var(--fg2);font-size:14px}
.profile .stat.on{color:#34c759}
.profile .bio{font-size:15px;line-height:1.4;max-width:300px;word-break:break-word}
.profile .btns{display:flex;gap:6px;margin-top:10px;align-items:center}
.avbtn{background:none;border:0;padding:0;position:relative;margin-bottom:6px}
.avbtn .cam{position:absolute;right:0;bottom:0;width:34px;height:34px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px}
.btnstack{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:12px}
.btnstack .primary,.btnstack .glassbtn{height:48px;font-size:17px;width:100%;border-radius:999px}
.glassbtn{border:1px solid rgba(var(--gc),.5);background:linear-gradient(135deg,rgba(var(--gc),calc(var(--ga1)*var(--gk))),rgba(var(--gc),calc(var(--ga2)*var(--gk))));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tiny{background:none;border:0;color:var(--fg2);font-size:13px;padding:6px 8px}

.nav{position:absolute;left:30px;right:30px;bottom:calc(20px + env(safe-area-inset-bottom));height:54px;border-radius:999px;display:flex;background:linear-gradient(135deg,rgba(var(--acc-rgb),.7),rgba(var(--acc-rgb),.4));border:1px solid rgba(255,255,255,.6);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 30px var(--shadow);z-index:5}
.nav .ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:999px;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.2));border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 4px 12px rgba(0,0,0,.25);transition:transform .38s cubic-bezier(.3,1.35,.5,1)}
.nav button{flex:1;position:relative;z-index:1;background:none;border:0;font-size:15px;color:#fff;opacity:.92}
.nav button.on{opacity:1;font-weight:600}

/* ---------- sub screens ---------- */
.subhead{display:flex;align-items:center;gap:6px;padding:calc(18px + env(safe-area-inset-top)) 16px 8px 8px}
.subhead h2{margin:0;font-size:22px;font-weight:600}
.subbody{flex:1;overflow-y:auto;padding:6px 16px 50px}
.back{background:none;border:0;width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex:none}
.back svg{stroke:var(--fg)}
.sect{margin:14px 0 6px 10px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg2)}
.group{border-radius:24px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid rgba(128,128,128,.18)}
.group .srow:first-child{border-top:0}
.stext{flex:1;min-width:0}
.slabel{font-size:16px}
.sdesc{font-size:12.5px;color:var(--fg2);margin-top:2px;line-height:1.35}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;z-index:2;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:16px;background:rgba(128,128,128,.4);transition:.2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:.2s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(20px)}
.seg{display:flex;border-radius:999px;padding:3px;background:rgba(128,128,128,.22);gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:999px;font-size:14px;color:var(--fg2)}
.seg button.on{background:var(--accent);color:#fff}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw-c{width:32px;height:32px;border-radius:50%;border:2px solid transparent;padding:0;position:relative}
.sw-c.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg)}
input[type=color]{width:34px;height:34px;border:0;padding:0;border-radius:50%;background:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.rangebox{width:100%}
.rangebox .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--fg2)}
.fl{display:block;margin:12px 4px 0;font-size:13px;color:var(--fg2)}
.fl input,.fl textarea,.stext textarea,.field{display:block;width:100%;margin-top:6px;border-radius:18px;border:1px solid rgba(128,128,128,.4);background:var(--field);padding:12px 16px;font-size:16px;outline:none;color:var(--fg);resize:none}
.fl input:focus,.fl textarea:focus{border-color:var(--accent)}
.fl input[readonly]{opacity:.6}
#epSave{margin-top:22px}

/* ---------- chat ---------- */
.chathead{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px 6px;border-radius:0 0 26px 26px;border-top:0}
.chathead .tap{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;min-width:0}
.chathead .nm{font-size:17px}
.chathead .st{font-size:12.5px;color:var(--fg2);margin-top:2px}
.chathead .st.on{color:#34c759}
#msgs{position:relative;z-index:1;flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column}
#msgs .empty{margin:auto}
.day{align-self:center;font-size:12px;color:var(--fg2);margin:12px 0 6px;padding:3px 12px;border-radius:999px;background:rgba(128,128,128,.16)}
.brow{display:flex;margin:4px 0}
.brow.me{justify-content:flex-end}
.bubble{position:relative;overflow:hidden;max-width:80%;padding:9px 14px 7px;border-radius:22px;word-break:break-word;white-space:pre-wrap;font-size:16px;line-height:1.35}
.bubble::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,0) 42%);pointer-events:none}
.bubble.me{background:linear-gradient(135deg,rgba(var(--acc-rgb),.8),rgba(var(--acc-rgb),.45));border:1px solid rgba(255,255,255,.4);color:#fff;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px rgba(var(--acc-rgb),.25);border-bottom-right-radius:8px}
.bubble.them{border-bottom-left-radius:8px}
.bubble.mm{padding:4px 4px 6px}
.bubble.bigtxt{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;font-size:46px;line-height:1.15;padding:2px 6px}
.bubble.bigtxt::before{display:none}
.bubble.bigtxt .tm{color:var(--fg2)}
.bubble .txt{position:relative}
.bubble .tm{position:relative;display:block;text-align:right;font-size:10.5px;opacity:.78;margin-top:3px;white-space:normal;padding-right:6px}
.bubble .tm.rd b{color:#7fe3ff}
.mm .tm{padding:0 8px}
.mimg,.mvid{display:block;max-width:100%;width:240px;max-height:320px;object-fit:cover;border-radius:18px;background:rgba(0,0,0,.25)}
.mvid{object-fit:contain}
.mimg.missing{height:120px}
.stkwrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.brow.them .stkwrap{align-items:flex-start}
.stk{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.stkwrap .tm{font-size:10.5px;color:var(--fg2)}
.voice{position:relative;display:flex;align-items:center;gap:10px;min-width:190px;padding:4px 6px 0 4px}
.voice .play{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.28);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.brow.them .voice .play{background:var(--accent)}
.voice .bar{flex:1;height:5px;border-radius:3px;background:rgba(128,128,128,.4);overflow:hidden}
.voice .bar i{display:block;height:100%;width:0;background:currentColor;border-radius:3px}
.voice .dur{font-size:12px;min-width:34px;text-align:right}
#composer{position:relative;z-index:2;display:flex;flex-direction:column;gap:8px;padding:6px 12px calc(12px + env(safe-area-inset-bottom))}
.crow{display:flex;gap:8px;align-items:center}
#msgIn{flex:1;min-width:0;height:48px;border-radius:999px;padding:0 20px;font-size:16px;outline:none}
#msgIn::placeholder{color:var(--muted)}
.cbtn{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;padding:0}
.cbtn svg{stroke:var(--fg)}
.send{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:linear-gradient(135deg,rgba(var(--acc-rgb),.95),rgba(var(--acc-rgb),.7));display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 16px var(--shadow);padding:0}
.send svg{stroke:#fff}
#recbar{display:flex;align-items:center;gap:10px;border-radius:999px;padding:6px 8px;height:60px}
#recbar .rt{flex:1;font-size:17px;display:flex;align-items:center;gap:10px}
#recbar .rd{width:11px;height:11px;border-radius:50%;background:#ff453a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#panel{border-radius:26px;height:268px;display:flex;flex-direction:column;overflow:hidden}
.ptabs{display:flex;gap:6px;padding:8px 10px 4px;align-items:center}
.ptabs button{border:0;background:none;color:var(--fg2);padding:7px 14px;border-radius:999px;font-size:14px}
.ptabs button.on{background:var(--accent);color:#fff}
.ptabs .sp{flex:1}
.pbody{flex:1;overflow-y:auto;padding:4px 10px 12px}
.pcat{font-size:12px;color:var(--fg2);margin:8px 4px 2px}
.egrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.eb{background:none;border:0;font-size:25px;padding:4px 0;border-radius:10px;line-height:1.2}
.eb:active{background:rgba(128,128,128,.25)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px}
.sgrid .sb{position:relative;aspect-ratio:1;border-radius:16px;border:1px dashed rgba(128,128,128,.35);background:rgba(128,128,128,.1);padding:4px;display:flex;align-items:center;justify-content:center;font-size:42px}
.sgrid .sb.solid{border-style:solid;border-color:transparent}
.sgrid .sb img{width:100%;height:100%;object-fit:contain}
.sgrid .sb .x{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:#ff453a;color:#fff;font-size:14px;line-height:22px;text-align:center}
.sgrid .sb.add{font-size:34px;color:var(--fg2)}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:30;background:var(--sheet);display:none;align-items:center;justify-content:center;padding:22px;overflow-y:auto;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.overlay.open{display:flex}
.card{width:100%;border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:10px;margin:auto}
.card h3{margin:0;font-size:20px;font-weight:600}
.card p{margin:0;color:var(--fg2);font-size:14px}
.card input[type=text],.card input:not([type]),.card textarea{height:46px;border-radius:999px;border:1px solid rgba(128,128,128,.45);background:var(--field);padding:0 18px;font-size:17px;outline:none;text-align:center;color:var(--fg)}
.card textarea{height:84px;border-radius:20px;padding:12px 16px;text-align:left;resize:none;font-size:16px}
.card .err{color:#ff6b6b;min-height:16px;font-size:13px}
.card .btns{display:flex;justify-content:flex-end;gap:6px;align-items:center;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.sl{display:block;font-size:14px;color:var(--fg2)}
.checker{align-self:center;width:230px;height:230px;border-radius:20px;overflow:hidden;background:repeating-conic-gradient(rgba(128,128,128,.35) 0 25%,rgba(128,128,128,.12) 0 50%) 0 0/20px 20px}
.checker canvas{width:100%;height:100%;display:block}

async function sendItem(u, m) {
  const ct = contacts[u]; if (!ct || !ct.id) return false;
  try {
    const mime = (m.mime || '').split(';')[0];
    if (m.kind !== 'text' && !m.path) {
      const b = await DB.get(m.mid); if (!b) return false;
      const path = me.id + '/' + m.id + '.' + ((mime.split('/')[1] || 'bin').replace(/[^a-z0-9]/gi, '') || 'bin');
      const up = await sb.storage.from('chat-media').upload(path, b, { contentType: mime, upsert: true });
      if (up.error) return false;
      m.path = path;
    }
    const r = await sb.from('messages').insert({ id: m.id, receiver_id: ct.id, kind: m.kind, body: m.text || '', media_path: m.path || null, mime: mime || null, dur: Math.round(m.dur || 0), big: !!m.big });
    if (r.error && r.error.code !== '23505' && r.error.code !== '42501') return false; // 23505 = sudah ada, 42501 = diblokir
    if (m.status === 'pending') m.status = 'sent';
    return true;
  } catch (e) { return false; }
}
async function deliver(u, m) {
  if (await sendItem(u, m)) { if (current === u) renderMsgs(false); renderHome(); }
}
function sendText(u, text, big) {
  const m = { id: uuid(), from: 'me', kind: 'text', text, big: !!big, ts: Date.now(), status: 'pending' };
  getMsgs(u).push(m); renderMsgs(true); renderHome(); deliver(u, m);
}
async function sendMedia(u, kind, blob, dur) {
  const m = { id: uuid(), from: 'me', kind, mid: null, mime: blob.type || 'application/octet-stream', dur: dur || 0, text: '', ts: Date.now(), status: 'pending' };
  m.mid = m.id; await DB.put(m.mid, blob);
  getMsgs(u).push(m); renderMsgs(true); renderHome(); deliver(u, m);
}

  finally { flushing[u] = false; }
}

function floodClear(ctx, size, tol, x0, y0, x1, y1) {
  const im = ctx.getImageData(0, 0, size, size), d = im.data, seen = new Uint8Array(size * size);
  const lim = tol * 2.6;
  [[x0, y0], [x1, y0], [x0, y1], [x1, y1]].forEach(([sx, sy]) => {
    const si = (sy * size + sx) * 4; if (d[si + 3] < 10) return;
    const r0 = d[si], g0 = d[si + 1], b0 = d[si + 2], st = [sy * size + sx];
    while (st.length) {
      const p = st.pop(); if (seen[p]) continue; seen[p] = 1;
      const i = p * 4;
      if (d[i + 3] === 0) continue;
      if (Math.hypot(d[i] - r0, d[i + 1] - g0, d[i + 2] - b0) > lim) continue;
      d[i + 3] = 0;
      const x = p % size, y = (p / size) | 0;
      if (x > 0) st.push(p - 1); if (x < size - 1) st.push(p + 1); if (y > 0) st.push(p - size); if (y < size - 1) st.push(p + size);
    }
  });
  ctx.putImageData(im, 0, 0);
}

  const w = Math.round(stkImg.width * sc), hh = Math.round(stkImg.height * sc);
  const off = document.createElement('canvas'); off.width = off.height = N;
  const px = Math.round((N - w) / 2), py = Math.round((N - hh) / 2);
  const o = off.getContext('2d'); o.drawImage(stkImg, px, py, w, hh);
  if ($('#stkBg').checked) floodClear(o, N, +$('#stkTol').value, px, py, px + w - 1, py + hh - 1);
  ctx.clearRect(0, 0, N, N);
  if (out) {
    const wh = document.createElement('canvas'); wh.width = wh.height = N;
    const wc = wh.getContext('2d'); wc.drawImage(off, 0, 0); wc.globalCompositeOperation = 'source-in'; wc.fillStyle = '#fff'; wc.fillRect(0, 0, N, N);

}

  if (need.length) {

async function addFriend() {
  const u = $('#friendIn').value.trim().toLowerCase(), err = t => { $('#friendErr').textContent = t; };
  if (!NAME_RE.test(u)) return err('Username tidak valid');
  if (u === me.username) return err('Itu username kamu sendiri');
  if (contacts[u]) return err('Sudah ada di kontak');
  const pr = await sb.from('profiles').select('id,username,name,bio,birth,avatar').eq('username', u).maybeSingle();
  if (pr.error) return err('Gagal mencari. Coba lagi.');
  if (!pr.data) return err('Username tidak ditemukan');
  const ins = await sb.from('contacts').upsert({ owner_id: me.id, contact_id: pr.data.id, blocked: false });
  if (ins.error) return err('Gagal menambah teman');
  addC(pr.data); blocked = blocked.filter(x => x !== u);
  await syncMissed(); closeSheet(); renderAll(); openChat(u);
}
$('#friendAdd').addEventListener('click', addFriend);
$('#friendIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addFriend(); } });
async function delContact(u) {
  if (!(await ask('Hapus ' + u + '?', 'Riwayat chat dengan ' + u + ' ikut terhapus.', 'hapus'))) return;
  getMsgs(u).forEach(m => m.mid && DB.del(m.mid));
  const cid = contacts[u] && contacts[u].id; if (cid) { sb.from('contacts').delete().eq('owner_id', me.id).eq('contact_id', cid).then(() => {}); delete idName[cid]; }
  delete contacts[u]; delete unread[u]; delete msgsCache[u];
  LS.del('zm_' + u); saveContacts(); LS.set('zc_unread', unread);
  stories = stories.filter(s => { if (s.from === u) { dropStory(s); return false; } return true; }); LS.set('zc_stories', stories);
  if (conns[u]) { try { conns[u].close(); } catch (e) {} delete conns[u]; }
  renderAll();
}
async function toggleBlock(u) {
  if (isBlocked(u)) { blocked = blocked.filter(x => x !== u); pushBlock(u); connectTo(u); toast(u + ' dibuka blokirnya'); }
  else {
    if (!(await ask('Blokir ' + u + '?', 'Kamu tidak akan menerima pesan atau story darinya.', 'blokir'))) return;
    blocked.push(u); pushBlock(u);
    if (conns[u]) { try { conns[u].close(); } catch (e) {} delete conns[u]; }
  }
  renderAll();
}
$('#addBtn2').addEventListener('click', openSheet);
function openProfileView(u) {
  const isMe = u === me.username, p = isMe ? me : (contacts[u] || {}), on = !isMe && isOnline(u);
  $('#pvCard').replaceChildren(...nn([
    avatar(u, p.avatar, 'xl'),
    h('div', { class: 'big' }, nameNode(u)),
    h('div', { class: 'stat' }, '@' + u),
    p.bio ? h('div', { class: 'bio' }, p.bio) : null,
    p.birth ? h('div', { class: 'stat' }, '🎂 ' + fmtBirth(p.birth)) : null,
    isMe ? null : h('div', { class: 'stat' + (on ? ' on' : '') }, on ? 'online' : 'offline'),
    h('div', { class: 'btns' },
      !isMe && curScreen !== 'chat' ? h('button', { class: 'primary small', type: 'button', onclick: () => { closePV(); openChat(u); } }, 'kirim pesan') : null,
      h('button', { class: 'ghost', type: 'button', onclick: closePV }, 'tutup'))]));
  $('#pv').classList.add('open');
}
function closePV() { $('#pv').classList.remove('open'); }
$('#pv').addEventListener('click', e => { if (e.target.id === 'pv') closePV(); });

/* ---------- profil & pengaturan ---------- */
function changeAvatar() {
  pickFile('image/*', async fs => {
    try {
      const img = await loadImg(fs[0]), s = 128, cv = document.createElement('canvas'); cv.width = cv.height = s;
      const r = Math.min(img.width, img.height);
      cv.getContext('2d').drawImage(img, (img.width - r) / 2, (img.height - r) / 2, r, r, 0, 0, s, s);
      me.avatar = cv.toDataURL('image/jpeg', .8); pushProfile(); renderAll(); broadcastHello();
      if (curScreen === 'editprofile') $('#epAv').replaceChildren(avatar(me.username, me.avatar, 'xl'), h('span', { class: 'cam' }, '📷'));
    } catch (e) { toast('Gambar tidak bisa dibaca'); }
  });
}
function openEditProfile() {
  $('#epAv').replaceChildren(avatar(me.username, me.avatar, 'xl'), h('span', { class: 'cam' }, '📷'));
  $('#epUser').value = '@' + me.username; $('#epName').value = me.name || ''; $('#epBio').value = me.bio || ''; $('#epBirth').value = me.birth || '';
  go('editprofile');
}
$('#epAv').addEventListener('click', changeAvatar);
$('#epSave').addEventListener('click', () => {
  me.name = $('#epName').value.trim().slice(0, 30); me.bio = $('#epBio').value.trim().slice(0, 120);
  const b = $('#epBirth').value; me.birth = /^\d{4}-\d{2}-\d{2}$/.test(b) ? b : '';
  pushProfile(); broadcastHello(); toast('Profil disimpan'); back();
});
function sRow(label, desc, ctrl) { return h('div', { class: 'srow' }, h('div', { class: 'stext' }, h('div', { class: 'slabel' }, label), desc ? h('div', { class: 'sdesc' }, desc) : null), ctrl); }
function sToggle(key, onchange) {
  const inp = h('input', { type: 'checkbox' }); inp.checked = !!S[key];
  inp.onchange = () => { S[key] = inp.checked; saveS(); if (onchange) onchange(); };
  return h('label', { class: 'switch' }, inp, h('i'));
}
function sGroup(title, ...rows) { return [h('div', { class: 'sect' }, title), h('div', { class: 'group glass' }, ...rows)]; }
function renderSettings() {
  const seg = h('div', { class: 'seg' }, ...[['dark', 'Gelap'], ['light', 'Terang'], ['auto', 'Sistem']].map(([v, l]) =>
    h('button', { type: 'button', class: S.theme === v ? 'on' : '', onclick: () => { S.theme = v; saveS(); applyTheme(); renderSettings(); } }, l)));
  const sw = h('div', { class: 'swatches' }, ...SWATCH.map(c => h('button', { type: 'button', class: 'sw-c' + (S.accent === c ? ' on' : ''), style: 'background:' + c, 'aria-label': c, onclick: () => { S.accent = c; saveS(); applyTheme(); renderSettings(); } })));
  const col = h('input', { type: 'color', value: S.accent, 'aria-label': 'warna kustom' });
  col.oninput = () => { S.accent = col.value; applyTheme(); }; col.onchange = () => { saveS(); renderSettings(); };
  sw.append(col);
  const range = (min, max, step, key, l1, l2) => {
    const r = h('input', { type: 'range', min, max, step, value: S[key] });
    r.oninput = () => { S[key] = +r.value; applyTheme(); }; r.onchange = saveS;
    return h('div', { class: 'rangebox' }, r, h('div', { class: 'ends' }, h('span', null, l1), h('span', null, l2)));
  };
  const blockedList = blocked.length ? blocked.join(', ') : 'tidak ada';
  $('#settingsBody').replaceChildren(
    ...sGroup('Akun',
      sRow('Edit profil', 'Foto, nama, bio, tanggal lahir', h('button', { class: 'tiny', type: 'button', onclick: openEditProfile }, 'buka ›')),
      isDev(me.username) ? sRow('Lencana developer', 'Centang emas tampil di namamu', devBadge()) : null),
    ...sGroup('Tampilan',
      sRow('Tema', null, seg),
      h('div', { class: 'srow' }, h('div', { class: 'stext' }, h('div', { class: 'slabel' }, 'Warna UI'), h('div', { style: 'margin-top:10px' }, sw))),
      h('div', { class: 'srow' }, h('div', { class: 'stext' }, h('div', { class: 'slabel' }, 'Kaca (liquid glass)'), h('div', { class: 'sdesc' }, 'Geser ke kiri supaya lebih transparan'), range(.3, 1.8, .05, 'glass', 'transparan', 'buram'))),
      h('div', { class: 'srow' }, h('div', { class: 'stext' }, h('div', { class: 'slabel' }, 'Blur'), range(0, 40, 1, 'blur', 'tajam', 'kabur')))),
    ...sGroup('Privasi',
      sRow('Status online', 'Jika mati, temanmu melihatmu offline', sToggle('showOnline', broadcastHello)),
      sRow('Tanda terbaca', 'Kirim ✓✓ biru saat kamu membuka pesan', sToggle('readReceipts', () => current && markRead(current))),
      sRow('Bagikan foto profil', null, sToggle('shareAvatar', broadcastHello)),
      sRow('Bagikan bio', null, sToggle('shareBio', broadcastHello)),
      sRow('Bagikan tanggal lahir', null, sToggle('shareBirth', broadcastHello)),
      sRow('Hanya kontak yang bisa chat', 'Pesan dari orang yang belum kamu tambahkan diabaikan', sToggle('onlyContacts')),
      sRow('Akun diblokir', blockedList, null)),
    ...sGroup('Notifikasi', sRow('Suara pesan masuk', null, sToggle('sound'))),
    ...sGroup('Data',
      sRow('Hapus semua riwayat chat', 'Akun dan kontak tetap ada', h('button', { class: 'tiny', type: 'button', onclick: clearChats }, 'hapus')),
      sRow('Hapus data perangkat & keluar', 'Akun di server tetap ada', h('button', { class: 'tiny', style: 'color:#ff6b61', type: 'button', onclick: async () => { if (await ask('Hapus semua data?', 'Akun, kontak, chat, story, dan stiker di perangkat ini akan dihapus.', 'hapus')) wipe(); } }, 'hapus'))),
    h('div', { class: 'sdesc', style: 'text-align:center;margin-top:18px' }, 'ZChat · pesan tersimpan aman di server'));
}
function openSettings() { renderSettings(); go('settings'); }
async function clearChats() {
  if (!(await ask('Hapus semua riwayat chat?', 'Semua pesan, foto, video, dan suara di perangkat ini dihapus.', 'hapus'))) return;
  for (const u of Object.keys(contacts)) { getMsgs(u).forEach(m => m.mid && DB.del(m.mid)); msgsCache[u] = []; LS.set('zm_' + u, []); }
  unread = {}; LS.set('zc_unread', unread); renderAll(); toast('Riwayat chat dihapus');
}

/* ---------- navigasi & menu ---------- */
document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => { setTab(b.dataset.tab); renderAll(); }));
const menu = $('#menu');
$('#menuBtn').addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('open'); });
document.addEventListener('click', e => { if (!menu.contains(e.target)) menu.classList.remove('open'); });
menu.addEventListener('click', e => {
  const m = e.target.dataset && e.target.dataset.m; if (!m) return;
  menu.classList.remove('open');
  if (m === 'story') openStoryNew(); else if (m === 'add') openSheet(); else if (m === 'settings') openSettings();
  else if (m === 'profile') { setTab('profile'); renderProfile(); } else if (m === 'logout') logout();
});

/* ---------- mulai ---------- */
applyTheme(); updateSendMode();
(async () => { if (!sb) { showAuth(); $('#authErr').textContent = 'Library Supabase gagal dimuat. Periksa internet.'; return; } const r = await sb.auth.getSession(); if (r.data && r.data.session) enter(r.data.session); else showAuth(); })();
})();
